name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate FUNDING.yml
        run: |
          echo "Validating FUNDING.yml..."
          python3 -c "
          import yaml, sys
          try:
              with open('FUNDING.yml', 'r') as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict):
                  print('ERROR: FUNDING.yml must be a YAML mapping')
                  sys.exit(1)
              valid_keys = {
                  'github', 'patreon', 'open_collective', 'ko_fi',
                  'tidelift', 'community_bridge', 'liberapay',
                  'issuehunt', 'lfx_crowdfunding', 'polar',
                  'buy_me_a_coffee', 'thanks_dev', 'custom'
              }
              for key in data:
                  if key not in valid_keys:
                      print(f'ERROR: Unknown FUNDING.yml key: {key}')
                      sys.exit(1)
              print('FUNDING.yml is valid')
          except yaml.YAMLError as e:
              print(f'ERROR: Invalid YAML: {e}')
              sys.exit(1)
          "
